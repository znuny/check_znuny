 *
 * One Service per --section, applied automatically to every host that
 * defines vars.znuny_healthstatus_url and either vars.znuny_healthstatus_api_key or
 * vars.znuny_healthstatus_api_key_file. Add more hosts by just setting those vars
 * - no per-host Service objects needed.
 *
 * Each section that supports thresholds has a sensible built-in default
 * (see below) which any host can override via a section-scoped custom var,
 * e.g. host.vars.znuny_health_cron_critical = "5". The generic
 * vars.znuny_health_warning/_critical/etc. set inside the apply rule are
 * what actually gets passed to the plugin per service - hosts never need to
 * touch those directly.
 */


/*
 * The loop variable can't be referenced in the name expression before `for`
 * (Icinga2 evaluates that expression before the loop variable is bound) - so
 * this iterates a dictionary instead of a plain array. Icinga2 automatically
 * appends the dictionary key to the given prefix for each generated Service
 * object name (e.g. "znuny-health-cron"); the dict value is a human-readable
 * label used for display_name (e.g. "Znuny Health CronTask").
 */
apply Service "znuny-health-" for (section => display_label in {
  "daemon"             = "Daemon"
  "commlog"            = "CommunicationLog"
  "cron"               = "CronTask"
  "genericagent"       = "GenericAgents"
  "future-tasks"       = "FutureTask"
  "unprocessed-emails" = "Unprocessed Emails"
  "system"             = "System"
}) {
  check_command = "znuny_health"
  vars.znuny_health_section = section
  display_name  = "Znuny Health " + display_label

  if (section == "daemon") {
    check_interval = 1m
    retry_interval = 30s
  } else if (section == "future-tasks") {
    check_interval = 15m
    retry_interval = 5m
  } else {
    check_interval = 5m
    retry_interval = 1m
  }

  /* commlog: counters + per-account status. No default warning/critical on
   * the Failed count - the API's own Health field (OK/Warning/Critical)
   * already drives alerting; a count threshold here is opt-in on top of that. */
  if (section == "commlog") {
    vars.znuny_health_log_hours = 12
    if (host.vars.znuny_health_commlog_log_hours) {
      vars.znuny_health_log_hours = host.vars.znuny_health_commlog_log_hours
    }
    vars.znuny_health_warning  = host.vars.znuny_health_commlog_warning
    vars.znuny_health_critical = host.vars.znuny_health_commlog_critical
  }

  /* cron: default warning on ANY failed recurring task; no default critical. */
  if (section == "cron") {
    vars.znuny_health_warning = "0"
    if (host.vars.znuny_health_cron_warning) {
      vars.znuny_health_warning = host.vars.znuny_health_cron_warning
    }
    vars.znuny_health_critical = host.vars.znuny_health_cron_critical
  }

  /* genericagent: same failed-task default as cron. No default runtime
   * threshold - "too long" varies too much by job to guess; opt-in only. */
  if (section == "genericagent") {
    vars.znuny_health_warning = "0"
    if (host.vars.znuny_health_genericagent_warning) {
      vars.znuny_health_warning = host.vars.znuny_health_genericagent_warning
    }
    vars.znuny_health_critical         = host.vars.znuny_health_genericagent_critical
    vars.znuny_health_warning_runtime  = host.vars.znuny_health_genericagent_warning_runtime
    vars.znuny_health_critical_runtime = host.vars.znuny_health_genericagent_critical_runtime
  }

  /* future-tasks / system: informational by default (queue/backlog size and
   * mail queue length are installation-specific) - opt-in thresholds only. */
  if (section == "future-tasks") {
    vars.znuny_health_warning  = host.vars.znuny_health_future_tasks_warning
    vars.znuny_health_critical = host.vars.znuny_health_future_tasks_critical
  }

  if (section == "system") {
    vars.znuny_health_warning  = host.vars.znuny_health_system_warning
    vars.znuny_health_critical = host.vars.znuny_health_system_critical
  }

  assign where host.vars.znuny_healthstatus_url && (host.vars.znuny_healthstatus_api_key || host.vars.znuny_healthstatus_api_key_file)
}
